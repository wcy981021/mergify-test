queue_rules:
  - name: default
    queue_conditions:
      - "#approved-reviews-by >= 1"
    merge_conditions:
      - "#approved-reviews-by >= 1"
pull_request_rules:
  - name: queue when approved
    conditions:
      - "#approved-reviews-by >= 1"
      - base = main
    actions:
      queue:
        name: default
